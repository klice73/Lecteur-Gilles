name: diag-sources
on:
  push:
    branches: [diag-sources]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - > diag-fin.txt 2>&1 <<'PY'
          import json,urllib.request
          for e in json.load(open('legal/source-manifest.json')):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(e['url'],headers={'User-Agent':'Lecteur-Gilles'}),timeout=60); print(r.status,e['url'])
              except Exception as x: print('ERREUR',x,e['url'])
          PY
          git config user.name ci; git config user.email ci@example.invalid
          git add diag-fin.txt; git commit -m "diag 2 [skip ci]"; git push
