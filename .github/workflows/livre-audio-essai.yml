name: livre-audio-essai
on:
  push:
    branches: [livre-audio]
    paths: ['entrainement/livre-audio/**', '.github/workflows/livre-audio-essai.yml']
permissions:
  contents: write
jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Moteur qwentts.cpp (meme revision que le lecteur Windows, CPU)
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg cmake > /dev/null
          git clone -q --recurse-submodules https://github.com/ServeurpersoCom/qwentts.cpp /tmp/qwentts
          cd /tmp/qwentts && git checkout -q 5916bf7 && git submodule update -q --init --recursive
          mkdir -p build && cd build && cmake .. -DCMAKE_BUILD_TYPE=Release > /dev/null && cmake --build . -j 4 > /dev/null
          ls /tmp/qwentts/build | head
      - name: Voix d'essai publique (0.6B base, clone de l'exemple freeman)
        run: |
          pip -q install huggingface_hub numpy pypdf
          python -c "from huggingface_hub import hf_hub_download as d;[d('Serveurperso/Qwen3-TTS-GGUF',f,local_dir='/tmp/voix') for f in ['qwen-tokenizer-12hz-Q8_0.gguf','qwen-talker-0.6b-base-Q8_0.gguf']]"
          cd /tmp/voix && cp /tmp/qwentts/examples/freeman.wav /tmp/qwentts/examples/freeman.txt .
          /tmp/qwentts/build/qwen-codec --model qwen-tokenizer-12hz-Q8_0.gguf --talker qwen-talker-0.6b-base-Q8_0.gguf -i freeman.wav 2>&1 | tail -3
          ls -la /tmp/voix
          mv freeman.txt reference.txt; mv freeman.spk reference.spk; mv freeman.rvq reference.rvq
          mv qwen-talker-0.6b-base-Q8_0.gguf Hubert-essai.gguf; mv qwen-tokenizer-12hz-Q8_0.gguf codec-Q8.gguf
      - name: Livre audio d'essai, comme Kaggle (2 tranches, coupure puis reprise par blocs)
        run: |
          mkdir -p resultats /tmp/docs && cp windows/documents.py windows/ebooks.py /tmp/docs/
          cp windows/tests/livre.pdf /tmp/livre-essai.pdf
          M="python entrainement/livre-audio/moteur_livre.py --qwen /tmp/qwentts/build/qwen-tts --dossier-voix /tmp/voix --livre /tmp/livre-essai.pdf --documents /tmp/docs/documents.py --premiers 3 --bloc 1"
          echo "== seance 1 : coupee apres le premier bloc" | tee resultats/essai.txt
          $M --sortie /tmp/s1 --tranche 0/2 --heures 0.001 2>&1 | tee -a resultats/essai.txt
          ls -R /tmp/s1 | tee -a resultats/essai.txt
          echo "== seance 2 : reprise, 2 tranches en parallele" | tee -a resultats/essai.txt
          $M --sortie /tmp/s2 --reprise /tmp/s1 --tranche 0/2 > /tmp/t0.txt 2>&1 &
          $M --sortie /tmp/s2 --reprise /tmp/s1 --tranche 1/2 > /tmp/t1.txt 2>&1; wait
          cat /tmp/t0.txt /tmp/t1.txt | tee -a resultats/essai.txt
          ls -R /tmp/s2 | tee -a resultats/essai.txt
          echo "== seance 3 : tout deja fait ; autre livre en entree ignore" | tee -a resultats/essai.txt
          mkdir -p /tmp/autre && cp /tmp/s2/*.mp3 /tmp/autre/ && echo '{"signature":"autre"}' > /tmp/autre/etat.json
          $M --sortie /tmp/s3 --reprise /tmp/s2 --tranche 0/1 2>&1 | tee -a resultats/essai.txt
          n=$(ls /tmp/s2/*.mp3 | wc -l); echo "MP3 seance 2 : $n (attendu 3)" | tee -a resultats/essai.txt
          grep -q "reprise depuis 1 dossier" /tmp/t0.txt && grep -c "DEJA FAIT" resultats/essai.txt
          test "$n" = 3
          cp "$(ls /tmp/s2/*.mp3 | head -1)" resultats/premier-chapitre.mp3
      - name: Phrases d'entrainement (etape 1 du Hubert leger)
        run: |
          python - <<'PY'
          L = ["Le vent soufflait doucement sur la plaine endormie.", "Il ouvrit la porte et regarda longtemps la mer.",
               "Nous avons marche jusqu'au village avant la nuit.", "Les etoiles brillaient au-dessus des toits de la ville.",
               "Elle lui tendit la lettre sans dire un seul mot.", "Le chemin montait entre les arbres couverts de neige."]
          open('/tmp/transcript.txt', 'w').write(''.join('x/%d.wav|%s|%s|3\n' % (i, t, t) for i, t in enumerate(L)))
          PY
          P="python entrainement/livre-audio/moteur_phrases.py --qwen /tmp/qwentts/build/qwen-tts --dossier-voix /tmp/voix --transcript /tmp/transcript.txt --nombre 6 --bloc 3"
          echo "== phrases" | tee -a resultats/essai.txt
          $P --sortie /tmp/p1 --tranche 0/2 2>&1 | tee -a resultats/essai.txt
          $P --sortie /tmp/p2 --reprise /tmp/p1 --reprise-seule
          $P --sortie /tmp/p2 --tranche 0/2 2>&1 | tee -a resultats/essai.txt
          $P --sortie /tmp/p2 --tranche 1/2 2>&1 | tee -a resultats/essai.txt
          cat /tmp/p2/*metadata*.csv /tmp/p2/*rejets* 2>/dev/null | tee -a resultats/essai.txt
          ffprobe -v error -show_entries stream=sample_rate,channels -of csv=p=0 /tmp/p2/wavs/hubert_00000.wav | tee -a resultats/essai.txt
          n=$(cat /tmp/p2/*metadata*.csv /tmp/p2/*rejets* 2>/dev/null | cut -d'|' -f1 | sort -u | wc -l); echo "phrases traitees : $n (attendu 6)" | tee -a resultats/essai.txt
          test "$n" = 6
          cp /tmp/p2/wavs/hubert_00000.wav resultats/phrase-0.wav || true
      - name: Rapporter
        if: always()
        run: |
          git config user.name ci; git config user.email ci@example.invalid
          git add -f resultats; git commit -m "essai livre audio [skip ci]" && git push || true
