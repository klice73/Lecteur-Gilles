name: Echantillons de voix (comparaison)
on:
  push:
    branches: [echantillons-voix]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Piper et voix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --quiet piper-tts==1.8.0
          mkdir -p voix
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR
          for v in tom/medium upmc/medium siwis/medium mls/medium; do
            n="fr_FR-$(echo $v | tr / -)"
            curl -sSfL "$base/$v/$n.onnx" -o voix/$n.onnx
            curl -sSfL "$base/$v/$n.onnx.json" -o voix/$n.onnx.json
            curl -sSfL "$base/$v/MODEL_CARD" -o voix/$n.MODEL_CARD.txt || true
          done
          gh release download test-23 -p "fr_FR-gilles-low.onnx*" -D voix
          ls -la voix
          python -c "import json;[print(f, json.load(open('voix/'+f)).get('speaker_id_map')) for f in ['fr_FR-upmc-medium.onnx.json','fr_FR-mls-medium.onnx.json']]"
      - name: Lire les phrases
        run: |
          python outils/echantillons.py outils/phrases-essai.json sons voix/fr_FR-gilles-low.onnx voix/fr_FR-tom-medium.onnx voix/fr_FR-siwis-medium.onnx voix/fr_FR-upmc-medium.onnx:pierre voix/fr_FR-upmc-medium.onnx:jessica
          ls -la sons
      - name: Ranger les extraits dans la branche (MP3)
        run: |
          mkdir -p echantillons
          for f in sons/*.wav; do ffmpeg -loglevel error -y -i "$f" -codec:a libmp3lame -q:a 4 "echantillons/$(basename "${f%.wav}").mp3"; done
          cp voix/*.MODEL_CARD.txt echantillons/
          python -c "import json,glob;[print(f, json.load(open(f)).get('speaker_id_map'), json.load(open(f))['audio']) for f in glob.glob('voix/*.json')]" > echantillons/voix.txt
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add echantillons && git commit -m "Extraits de voix produits par la CI [skip ci]" && git push
