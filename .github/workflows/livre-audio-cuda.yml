name: livre-audio-cuda
on:
  push:
    branches: [livre-audio]
    paths: ['.github/workflows/livre-audio-cuda.yml']
permissions:
  contents: write
jobs:
  cuda:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container: nvidia/cuda:12.4.1-devel-ubuntu22.04
    steps:
      - name: Compiler qwentts.cpp 5916bf7 avec CUDA (sm_75 comme la T4 de Kaggle)
        run: |
          set +e
          apt-get -qq update && apt-get -qq install -y git cmake build-essential python3-pip > /dev/null
          cmake --version | head -1 > /tmp/r.txt
          git clone -q --recurse-submodules https://github.com/ServeurpersoCom/qwentts.cpp /tmp/q
          cd /tmp/q && git checkout -q 5916bf7 && git submodule update -q --init --recursive
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=75 > /tmp/c.log 2>&1
          echo "cmake: $?" >> /tmp/r.txt
          if grep -qi "cmake.*or higher is required" /tmp/c.log; then
            pip3 install -q cmake && hash -r && cmake --version | head -1 >> /tmp/r.txt
            rm -rf /tmp/q/build/* && cmake .. -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=75 > /tmp/c.log 2>&1
            echo "cmake (pip): $?" >> /tmp/r.txt
          fi
          cmake --build . -j 4 > /tmp/b.log 2>&1
          echo "build: $?" >> /tmp/r.txt
          ls -la qwen-tts bin/qwen-tts 2>&1 >> /tmp/r.txt
          (ldd qwen-tts bin/qwen-tts 2>&1 | grep -iE "cuda|cublas" ) >> /tmp/r.txt
          echo "--- cmake log (fin)" >> /tmp/r.txt; tail -40 /tmp/c.log >> /tmp/r.txt
          echo "--- build log (erreurs)" >> /tmp/r.txt; grep -iE "error|erreur" /tmp/b.log | head -40 >> /tmp/r.txt
          echo "--- build log (fin)" >> /tmp/r.txt; tail -20 /tmp/b.log >> /tmp/r.txt
          cd /tmp && git clone -q -b livre-audio https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} depot
          mkdir -p depot/resultats && cp /tmp/r.txt depot/resultats/cuda.txt && cd depot
          git config user.name ci && git config user.email ci@example.invalid
          git add resultats/cuda.txt && git commit -qm "Resultat compilation CUDA" && git push -q
          grep -q "build: 0" /tmp/r.txt
