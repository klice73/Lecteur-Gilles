name: Construire et publier APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: PrÃ©parer la voix Gilles et le moteur natif
        run: |
          python prepare.py
          python legal/prepare_notices.py
      - name: Compiler, tester et vÃ©rifier Android
        run: |
          gradle assembleDebug testDebugUnitTest lintDebug --no-daemon --console=plain
          gradle :app:dependencies --configuration debugRuntimeClasspath --console=plain > android-runtime-dependencies.txt
      - name: Activer la virtualisation Android
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tester Gilles et pause/reprise sur Android Ã©mulÃ©
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: gradle connectedDebugAndroidTest --no-daemon --console=plain
      - name: PrÃ©parer APK installable
        run: cp app/build/outputs/apk/debug/app-debug.apk Lecteur-Gilles-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Lecteur-Gilles-Android
          path: |
            Lecteur-Gilles-Android.apk
            Lecteur-Gilles-Sources-preparation.zip
            android-runtime-dependencies.txt
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/androidTests/connected/
      - name: Publier la version de test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="test-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Lecteur-Gilles-Android.apk Lecteur-Gilles-Sources-preparation.zip android-runtime-dependencies.txt --target "$GITHUB_SHA" --prerelease --title "Lecteur Gilles â€” test ${GITHUB_RUN_NUMBER}" --notes "APK de test signÃ© : voix Gilles incluse, lecture locale. Compilation, tests unitaires et lint exÃ©cutÃ©s. Ã€ tester sur un tÃ©lÃ©phone Android 8+. Signature de dÃ©veloppement : une mise Ã  jour peut nÃ©cessiter de dÃ©sinstaller une version de test prÃ©cÃ©dente."
