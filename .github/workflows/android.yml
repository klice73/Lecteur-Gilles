name: Construire et publier APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Préparer la voix Gilles et le moteur natif
        run: |
          python -m pip install --quiet onnx==1.23.2
          python prepare.py
          python legal/prepare_notices.py
          python -c "import onnx;m=onnx.load('app/src/main/assets/vits-piper-fr_FR-gilles-low/fr_FR-gilles-low.onnx');assert any(p.key=='lecteur_gilles_plafond_durees' for p in m.metadata_props),'voix non plafonnee';print('Voix plafonnee verifiee')"
      - name: Compiler, tester et vérifier Android
        run: |
          gradle assembleDebug testDebugUnitTest lintDebug --no-daemon --console=plain
          gradle :app:dependencies --configuration debugRuntimeClasspath --console=plain > android-runtime-dependencies.txt
      - name: Activer la virtualisation Android
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tester Gilles et pause/reprise sur Android émulé
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          disk-size: 4096M
          script: |
            adb logcat -c || true
            gradle connectedDebugAndroidTest --no-daemon --console=plain || (adb logcat -d -t 3000 > logcat-echec.txt; exit 1)
            adb pull /sdcard/Android/data/fr.lecteurgilles.android/files/screenshots android-screenshots || echo "Captures absentes : l'application de test est desinstallee apres les tests."
      - name: Diagnostic lisible en cas d'échec du test émulé
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, re, xml.etree.ElementTree as ET
          def note(titre, texte):
              texte = texte.replace('%', '%25').replace('\r', '').replace('\n', '%0A')[:1800]
              print('::error title=%s::%s' % (titre, texte))
          n = 0
          fichiers = glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True)
          cas_total = 0
          for f in fichiers:
              for cas in ET.parse(f).getroot().iter('testcase'):
                  cas_total += 1
                  for e in list(cas.findall('failure')) + list(cas.findall('error')):
                      n += 1
                      note('Test ' + cas.get('name', '?'), (e.get('message') or '') + '\n' + (e.text or '')[:1200])
          try:
              lignes = open('logcat-echec.txt', encoding='utf-8', errors='replace').read().splitlines()
              utiles = [l for l in lignes if re.search(r'FATAL|AndroidRuntime|lecteurgilles|sherpa|onnx|AudioTrack|Exception', l)]
              note('Journal du telephone emule', '\n'.join(utiles[-40:]) or 'aucune ligne utile')
          except FileNotFoundError:
              note('Journal du telephone emule', 'absent : echec avant ou pendant le demarrage de l emulateur')
          if not fichiers:
              note('Resultats de test', 'aucun fichier de resultat : echec avant les tests (compilation, installation ou emulateur)')
          elif not n:
              note('Resultats de test', '%d tests emules executes, tous reussis : l echec vient d une autre commande de l etape' % cas_total)
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lecteur-Gilles-QA
          path: |
            android-screenshots/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/androidTests/connected/
            android-runtime-dependencies.txt
      - name: Préparer les sources identifiées et licences
        run: python legal/package_sources.py
      - name: Préparer APK installable
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Lecteur-Gilles-Android.apk
          # verifier que la voix livree dans l'APK est bien la voix plafonnee
          unzip -p Lecteur-Gilles-Android.apk assets/vits-piper-fr_FR-gilles-low/fr_FR-gilles-low.onnx > voix-apk.onnx
          python -c "import onnx;m=onnx.load('voix-apk.onnx');assert any(p.key=='lecteur_gilles_plafond_durees' for p in m.metadata_props),'APK sans voix plafonnee';print('APK : voix plafonnee')"
          # meme voix pour Windows, avec la duree de chaque son exposee (surlignage mot a mot exact)
          python plafonner_voix.py voix-apk.onnx fr_FR-gilles-low.onnx --alignement
          unzip -p Lecteur-Gilles-Android.apk assets/vits-piper-fr_FR-gilles-low/fr_FR-gilles-low.onnx.json > fr_FR-gilles-low.onnx.json
          # version 1.9 : voix Tom (posee), presente dans l'APK ; pour Windows, duree de chaque son exposee (audio inchange)
          unzip -p Lecteur-Gilles-Android.apk assets/vits-piper-fr_FR-tom-medium/fr_FR-tom-medium.onnx > tom-apk.onnx
          python aligner_voix.py tom-apk.onnx fr_FR-tom-medium.onnx
          unzip -p Lecteur-Gilles-Android.apk assets/vits-piper-fr_FR-tom-medium/fr_FR-tom-medium.onnx.json > fr_FR-tom-medium.onnx.json
          sha256sum fr_FR-gilles-low.onnx fr_FR-tom-medium.onnx Lecteur-Gilles-Android.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Lecteur-Gilles-Android
          path: |
            Lecteur-Gilles-Android.apk
            Lecteur-Gilles-Sources-preparation.zip
            android-runtime-dependencies.txt
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/androidTests/connected/
      - name: Publier la version de test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="test-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Lecteur-Gilles-Android.apk fr_FR-gilles-low.onnx fr_FR-gilles-low.onnx.json fr_FR-tom-medium.onnx fr_FR-tom-medium.onnx.json legal/licenses/AGPL-3.0.txt legal/licenses/Tom-CONDITIONS-USAGE.txt SHA256SUMS.txt Lecteur-Gilles-Sources-preparation.zip android-runtime-dependencies.txt --target "$GITHUB_SHA" --prerelease --title "Lecteur Gilles — test ${GITHUB_RUN_NUMBER}" --notes "Version 1.9 : nouvelle voix « Tom (posé) », grave et posée, nasales (an, on, in) correctes ; Gilles reste disponible. Voix Tom : AGPL-3.0 et conditions d'usage de la voix (AGPL-3.0.txt, Tom-CONDITIONS-USAGE.txt). Version 1.8 : lexique de prononciation modifiable (« Prononciations… »). Version 1.7 : EPUB et FictionBook ; conversion de formats supplémentaires via calibre sous Windows.  « ☰ Aller à… » (table des matières et pages du livre), page en cours affichée ; surlignage mot à mot et position de lecture conservée (1.5). Android : installer Lecteur-Gilles-Android.apk. Windows : décompresser Lecteur-Gilles-Windows-1.9.zip dans le dossier du lecteur (voir MISE-A-JOUR-1.9.txt). Compilation, tests unitaires et lint exécutés. À tester sur un téléphone Android 8+. Signature de développement : une mise à jour peut nécessiter de désinstaller une version de test précédente."

  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Voix Windows publiée par l'étape Android
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag="test-${{ github.run_number }}"
          New-Item -ItemType Directory -Force windows\voix | Out-Null
          gh release download $tag -p "fr_FR-*.onnx*" -D windows\voix
          Get-ChildItem windows\voix
      - name: Moteur Python du lecteur
        shell: pwsh
        run: |
          python -m venv windows\runtime
          windows\runtime\Scripts\python.exe -m pip install --quiet -r windows\requirements.txt
      - name: Minutage mot à mot avec la vraie voix
        shell: pwsh
        run: |
          $req=@{text="Chapitre un.`n`nBonjour, je suis Gilles. Le soleil se couche derrière la montagne, et la ville s'endort doucement. Oui. Fin du test.";speed=1.0;voice="fr_FR-gilles-low"} | ConvertTo-Json
          [IO.File]::WriteAllText("$PWD\windows\req.json",$req,(New-Object Text.UTF8Encoding $false))
          windows\runtime\Scripts\python.exe windows\lecteur.py --stream windows\req.json windows\flux
          if($LASTEXITCODE -ne 0){throw "lecteur.py en echec"}
          $j=Get-Content windows\flux\part-000001.json -Raw | ConvertFrom-Json
          "mots: $($j.mots.Count)  phrases: $($j.phrases.Count)  alignees exactement: $($j.exactes)  estimees: $($j.estimees)"
          if($j.mots.Count -lt 20 -or $j.exactes -lt 1){throw "minutage incomplet"}
      - name: Minutage mot à mot avec la voix Tom (posé)
        shell: pwsh
        run: |
          $req=@{text="Bonjour, je suis Tom. Le vent souffle dans les champs de blé, on entend un chant lointain. Fin du test.";speed=1.0;voice="fr_FR-tom-medium"} | ConvertTo-Json
          [IO.File]::WriteAllText("$PWD\windows\req-tom.json",$req,(New-Object Text.UTF8Encoding $false))
          windows\runtime\Scripts\python.exe windows\lecteur.py --stream windows\req-tom.json windows\flux-tom
          if($LASTEXITCODE -ne 0){throw "lecteur.py (Tom) en echec"}
          $j=Get-Content windows\flux-tom\part-000001.json -Raw | ConvertFrom-Json
          "Tom - mots: $($j.mots.Count)  alignees exactement: $($j.exactes)  estimees: $($j.estimees)"
          if($j.mots.Count -lt 15 -or $j.exactes -lt 1){throw "minutage Tom incomplet"}
      - name: Repères des documents (pages, table des matières)
        shell: pwsh
        run: |
          windows\runtime\Scripts\python.exe windows\tests\test_ebooks.py
          if($LASTEXITCODE -ne 0){throw "test ebooks en echec"}
          windows\runtime\Scripts\python.exe windows\tests\test_reperes.py
          if($LASTEXITCODE -ne 0){throw "test des reperes en echec"}
          windows\runtime\Scripts\python.exe windows\tests\test_lexique.py
          if($LASTEXITCODE -ne 0){throw "test du lexique en echec"}
          windows\runtime\Scripts\python.exe windows\documents.py windows\tests\livre.pdf windows\doc-livre.json
          if($LASTEXITCODE -ne 0){throw "documents.py en echec"}
      - name: Compiler Piper-Gilles.exe (C#, .NET Framework)
        shell: pwsh
        run: windows\build.ps1
      - name: Tester surlignage et mémoire de position (sans carte son)
        shell: pwsh
        run: |
          $p=Start-Process -FilePath windows\Piper-Gilles.exe -ArgumentList "--test-minutage","$PWD\windows\flux\part-000001.json" -Wait -PassThru
          Get-Content windows\verification-minutage.txt
          if($p.ExitCode -ne 0){throw "test Windows en echec"}
          $q=Start-Process -FilePath windows\Piper-Gilles.exe -ArgumentList "--test-reperes","$PWD\windows\doc-livre.json" -Wait -PassThru
          Get-Content windows\verification-reperes.txt
          if($q.ExitCode -ne 0){throw "test Aller a en echec"}
      - name: Rapports des tests Windows lisibles en cas d'échec
        if: failure()
        shell: pwsh
        run: |
          foreach($f in "windows\verification-minutage.txt","windows\verification-reperes.txt"){
            if(Test-Path $f){ $c=(Get-Content $f -Raw) -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'; Write-Output "::error title=$f::$($c.Substring(0,[Math]::Min(1800,$c.Length)))" }
            else { Write-Output "::error title=$f::absent" }
          }
      - name: Paquet de mise à jour Windows
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force paquet\voix | Out-Null
          Copy-Item windows\Piper-Gilles.exe,windows\lecteur.py,windows\documents.py,windows\ebooks.py,windows\MISE-A-JOUR-1.9.txt,windows\verification-minutage.txt,windows\verification-reperes.txt paquet\
          python legal/prepare_notices.py
          Copy-Item -Recurse windows\licences paquet\licences
          Copy-Item THIRD_PARTY_NOTICES.md paquet\
          Copy-Item windows\voix\fr_FR-gilles-low.onnx,windows\voix\fr_FR-gilles-low.onnx.json,windows\voix\fr_FR-tom-medium.onnx,windows\voix\fr_FR-tom-medium.onnx.json paquet\voix\
          Compress-Archive -Path paquet\* -DestinationPath Lecteur-Gilles-Windows-1.9.zip
          gh release upload "test-${{ github.run_number }}" Lecteur-Gilles-Windows-1.9.zip
