name: Construire et publier APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Préparer la voix Gilles et le moteur natif
        run: python prepare.py
      - name: Compiler, tester et vérifier Android
        run: gradle assembleDebug testDebugUnitTest lintDebug --no-daemon --console=plain
      - name: Activer la virtualisation Android
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tester Gilles et pause/reprise sur Android émulé
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: gradle connectedDebugAndroidTest --no-daemon --console=plain
      - name: Préparer APK installable
        run: cp app/build/outputs/apk/debug/app-debug.apk Lecteur-Gilles-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Lecteur-Gilles-Android
          path: |
            Lecteur-Gilles-Android.apk
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/androidTests/connected/
      - name: Publier la version de test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="test-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Lecteur-Gilles-Android.apk --target "$GITHUB_SHA" --prerelease --title "Lecteur Gilles — test ${GITHUB_RUN_NUMBER}" --notes "APK de test signé : voix Gilles incluse, lecture locale. Compilation, tests unitaires et lint exécutés. À tester sur un téléphone Android 8+. Signature de développement : une mise à jour peut nécessiter de désinstaller une version de test précédente."
